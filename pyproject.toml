[project]
name = "newspaper-pipeline"
version = "0.3.0"
description = "Turns a newspaper PDF into structured articles (headline, text, summary, bounding box)."
readme = "README.md"
requires-python = ">=3.12"

# Runtime dependencies: what the program needs to RUN.
# Lower bounds only here; the exact versions that were tested live in uv.lock.
dependencies = [
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "flask>=3.0",          # replaced by FastAPI in the next step
]

# Dev dependencies: what WE need to build and check it. Never shipped to users.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.uv]
package = false   # an application, not a library we publish: just install the dependencies

# ---------------------------------------------------------------- ruff
# Ruff = linter. Reads code WITHOUT running it and flags bugs and bad habits.
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: basic style errors
    "F",        # pyflakes: unused imports/variables, undefined names (real bugs)
    "I",        # isort: imports in a consistent order
    "B",        # bugbear: likely bugs (e.g. closures in loops, zip without strict)
    "UP",       # pyupgrade: use modern Python syntax
    "SIM",      # simplify: needlessly complicated code
]
ignore = [
    "E501",  # line length: we do not enforce it (no auto-formatter yet)
    "E741",  # `l` as a variable name: used on purpose for "line" throughout the geometry code
]

# ---------------------------------------------------------------- mypy
# mypy = type checker. Reads the type hints (`x: int`) and finds places where they are contradicted.
[tool.mypy]
python_version = "3.12"
files = ["pipeline", "eval", "app.py"]
check_untyped_defs = true     # also check inside functions that have no hints
warn_unused_ignores = true    # a `# type: ignore` that is no longer needed is an error
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pytesseract.*"]    # this library ships no type information
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' --strict-markers"   # slow OCR tests are opt-in: pytest -m slow
markers = [
    "slow: runs real OCR on sample PDFs (about a minute or more). Run with: pytest -m slow",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["pipeline", "eval"]
